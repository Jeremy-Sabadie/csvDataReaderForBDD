spring.application.name=demo_batch

# =======================
# Datasource
# =======================
spring.datasource.url=jdbc:mariadb://localhost:3306/ma_base?useUnicode=true&characterEncoding=utf8
spring.datasource.username=monuser
spring.datasource.password=MotDePasseUser
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# =======================
# JPA / Hibernate
# =======================
# crée ou met à jour automatiquement les tables des entités
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =======================
# Spring Batch
# =======================
# On empêche Spring Boot de lancer un job automatiquement
spring.batch.job.enabled=false

# Nom du job par défaut (peut être écrasé en ligne de commande)
spring.batch.job.name=importPersonJob

# Batch ne recrée pas ses tables internes
spring.batch.jdbc.initialize-schema=never

# =======================
# Initialisation SQL
# =======================
spring.sql.init.mode=never

# =======================
# Logs
# =======================
logging.level.org.springframework.batch=INFO
