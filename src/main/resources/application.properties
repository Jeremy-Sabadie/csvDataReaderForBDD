spring.application.name=demo_batch

# Datasource
spring.datasource.url=jdbc:mariadb://localhost:3306/ma_base?useUnicode=true&characterEncoding=utf8
spring.datasource.username=monuser
spring.datasource.password=MotDePasseUser
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate (ne plus toucher au schéma)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring Batch
spring.batch.job.enabled=true
spring.batch.job.name=importPersonJob
spring.batch.jdbc.initialize-schema=never

# Pas d'init SQL manuel (on a déjà tout)
spring.sql.init.mode=never

# Logs
logging.level.org.springframework.batch=INFO
